name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"      # 每 12 小时一次
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成粉色贪吃蛇
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff8fab&color_dots=#ffe5ec,#ffc2d1,#ff8fab,#ff5c8a,#d6336c
            dist/snake-dark.svg?color_snake=#ffb3d9&color_dots=#2b1b26,#5c2e46,#a44b73,#ff8fab,#ffd6e8

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
