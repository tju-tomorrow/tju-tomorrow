name: Profile README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # 基础统计
          SHOW_TOTAL_CODE_TIME: "True"        # 总编码时间
          SHOW_LINES_OF_CODE: "True"          # 代码行数
          SHOW_TIMEZONE: "false"              # 时区

          # 时间相关
          SHOW_DAYS_OF_WEEK: "True"           # 每周分布
          SHOW_UPDATED_DATE: "True"           # 更新日期

          # 编码环境
          SHOW_PROJECTS: "True"               # 项目
          SHOW_LANGUAGE: "True"               # 编程语言
          SHOW_EDITORS: "false"               # 编辑器
          SHOW_OS: "false"                    # 操作系统

          # 提交信息
          SHOW_COMMIT: "True"                 # 提交分布
          SHOW_SHORT_INFO: "True"             # 简短信息（仓库数等）
          COMMIT_BY_ME: "True"                # 只统计我的提交
          SHOW_LOC_CHART: "false"
          SHOW_LANGUAGE_PER_REPO: "True"      # 各语言仓库占比

          # 其他
          SHOW_PROFILE_VIEWS: "True"          # 主页浏览量徽章
          IGNORED_REPOS: ""                   # 忽略的仓库，逗号分隔
          LOCALE: "en"                        # 语言 (en/cn)
          COMMIT_MESSAGE: "Updated waka-readme graph with new metrics"
